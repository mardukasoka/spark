<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indigo Atlas · Spark prototype (illustrative)</title>
<style>
html,body{margin:0;height:100%;background:#070c18;color:#e6ecf8;font:14px system-ui,sans-serif}
#view{position:fixed;inset:0}#panel{position:fixed;top:12px;left:12px;right:12px;max-width:430px;background:#101a2be8;padding:14px;border:1px solid #43516a;border-radius:12px}
input{width:100%;box-sizing:border-box;padding:9px;margin:8px 0;color:#e6ecf8;background:#17243b;border:1px solid #536681;border-radius:6px}
button{padding:8px 12px;border:0;border-radius:6px;background:#a9d4ff;color:#061323;cursor:pointer}
small{display:block;color:#aebbd0;margin-top:6px}#status{margin-top:9px}#fps{position:fixed;right:12px;bottom:12px;background:#101a2bdc;padding:8px;border-radius:6px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"}}</script>
</head>
<body>
<div id="view"></div>
<section id="panel"><strong>Indigo Atlas · Gaussian splat prototype</strong>
<small>Illustrative 3D scene only — NOT astronomical measurements. Requires WebGL2 and network access. Only load trusted, appropriately licensed SPZ assets.</small>
<label for="asset">SPZ asset URL (HTTPS)</label><input id="asset" type="url" placeholder="https://…/example.spz">
<button id="load">Load splat</button> <button id="reset">Reset view</button>
<div id="status" role="status" aria-live="polite">Coordinate grid ready; no splat loaded.</div></section>
<div id="fps" aria-label="performance">FPS: —</div>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {SparkRenderer,SplatMesh} from "@sparkjsdev/spark";
const status=document.querySelector("#status");
const root=document.querySelector("#view");
if(!document.createElement("canvas").getContext("webgl2")){
 status.textContent="WebGL2 unavailable; this device cannot run the splat renderer.";
 throw new Error("WebGL2 unavailable");
}
const scene=new THREE.Scene();scene.background=new THREE.Color("#070c18");
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.01,1000);
camera.position.set(3,2.5,5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"low-power"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
root.append(renderer.domElement);
const spark=new SparkRenderer({renderer});scene.add(spark);
scene.add(new THREE.GridHelper(10,10,0x5c91bd,0x263b57));
scene.add(new THREE.AxesHelper(2));
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
controls.target.set(0,0,0);
let current=null;
document.querySelector("#load").onclick=()=>{
 const raw=document.querySelector("#asset").value.trim();
 let url;try{url=new URL(raw)}catch{status.textContent="Enter a valid HTTPS URL.";return}
 if(url.protocol!=="https:"||!url.pathname.toLowerCase().endsWith(".spz")){status.textContent="Only HTTPS .spz URLs are supported in this prototype.";return}
 if(current){scene.remove(current);current.dispose?.();current=null}
 try{current=new SplatMesh({url:url.href});scene.add(current);status.textContent="Loading splat; inspect browser console for asset/CORS errors."}
 catch(e){status.textContent="Splat initialization failed: "+e.message}
};
document.querySelector("#reset").onclick=()=>{camera.position.set(3,2.5,5);controls.target.set(0,0,0);controls.update()};
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let frames=0,last=performance.now();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);frames++;const now=performance.now();if(now-last>=1000){document.querySelector("#fps").textContent="FPS: "+Math.round(frames*1000/(now-last));frames=0;last=now}});
</script></body></html>
